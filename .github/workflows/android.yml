
name: DeepRead Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Paketleri kur
        run: npm ci

      - name: Android projesini senkronize et
        run: npx cap sync android

      - name: APK olustur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: DeepRead-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
